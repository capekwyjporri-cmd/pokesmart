<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéSmart — Painel de Análise</title>
    <!-- Tailwind CSS para deixar o visual moderno e bonito -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Cor de fundo escura estilo Pokémon Showdown */
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto bg-slate-900 rounded-xl shadow-2xl border border-slate-800 p-6 mt-10">
        
        <!-- Cabeçalho V6 -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
            <div>
                <h2 class="text-2xl font-bold tracking-wide flex items-center gap-2 text-yellow-400">
                    📊 V6 — Análise de Cobertura e Sinergia
                </h2>
                <p class="text-sm text-slate-400">Análise automática baseada no meta atual do Showdown.</p>
            </div>
            <span class="bg-emerald-500/20 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-semibold border border-emerald-500/30">
                Dados Ativos
            </span>
        </div>

        <!-- Grid de Pokémon do Time -->
        <div id="grid-time" class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-8">
            <!-- Os Pokémon serão inseridos aqui via JavaScript -->
        </div>

        <!-- Seção do Gráfico de Sinergia -->
        <div>
            <h3 class="text-lg font-semibold mb-4 text-slate-200 flex items-center gap-2">
                🛡️ Balanço Defensivo do Time
            </h3>
            <p class="text-xs text-slate-400 mb-4">
                Barras para a <span class="text-red-400 font-bold">direita</span> indicam fraquezas. Barras para a <span class="text-emerald-400 font-bold">esquerda</span> indicam resistências.
            </p>

            <!-- Lista de Tipos e Barras de Status -->
            <div id="grafico-tipos" class="space-y-3">
                <!-- As barras do gráfico serão geradas aqui via JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // Matriz de fraquezas e resistências oficial de Pokémon
        const tabelaTipos = {
            Normal: { fraquezas: ['Lutador'], resistencias: [], imunidades: ['Fantasma'] },
            Fogo: { fraquezas: ['Água', 'Terra', 'Pedra'], resistencias: ['Fogo', 'Grama', 'Gelo', 'Inseto', 'Aço', 'Fada'], imunidades: [] },
            Água: { fraquezas: ['Elétrico', 'Grama'], resistencias: ['Fogo', 'Água', 'Gelo', 'Aço'], imunidades: [] },
            Grama: { fraquezas: ['Fogo', 'Gelo', 'Venenoso', 'Voador', 'Inseto'], resistencias: ['Água', 'Elétrico', 'Grama', 'Terra'], imunidades: [] },
            Elétrico: { fraquezas: ['Terra'], resistencias: ['Elétrico', 'Voador', 'Aço'], imunidades: [] },
            Gelo: { fraquezas: ['Fogo', 'Lutador', 'Pedra', 'Aço'], resistencias: ['Gelo'], imunidades: [] },
            Lutador: { fraquezas: ['Voador', 'Psíquico', 'Fada'], resistencias: ['Inseto', 'Pedra', 'Sombrio'], imunidades: [] },
            Venenoso: { fraquezas: ['Terra', 'Psíquico'], resistencias: ['Grama', 'Lutador', 'Venenoso', 'Inseto', 'Fada'], imunidades: [] },
            Terra: { fraquezas: ['Água', 'Gelo', 'Grama'], resistencias: ['Venenoso', 'Pedra'], imunidades: ['Elétrico'] },
            Voador: { fraquezas: ['Elétrico', 'Gelo', 'Pedra'], resistencias: ['Grama', 'Lutador', 'Inseto'], imunidades: ['Terra'] },
            Psíquico: { fraquezas: ['Inseto', 'Fantasma', 'Sombrio'], resistencias: ['Lutador', 'Psíquico'], imunidades: [] },
            Inseto: { fraquezas: ['Fogo', 'Voador', 'Pedra'], resistencias: ['Grama', 'Lutador', 'Terra'], imunidades: [] },
            Pedra: { fraquezas: ['Água', 'Grama', 'Lutador', 'Terra', 'Aço'], resistencias: ['Normal', 'Fogo', 'Venenoso', 'Voador'], imunidades: [] },
            Fantasma: { fraquezas: ['Fantasma', 'Sombrio'], resistencias: ['Venenoso', 'Inseto'], imunidades: ['Normal', 'Lutador'] },
            Dragão: { fraquezas: ['Gelo', 'Dragão', 'Fada'], resistencias: ['Fogo', 'Água', 'Elétrico', 'Grama'], imunidades: [] },
            Sombrio: { fraquezas: ['Lutador', 'Inseto', 'Fada'], resistencias: ['Fantasma', 'Sombrio'], imunidades: ['Psíquico'] },
            Aço: { fraquezas: ['Fogo', 'Lutador', 'Terra'], resistencias: ['Normal', 'Grama', 'Gelo', 'Voador', 'Psíquico', 'Inseto', 'Pedra', 'Dragão', 'Aço', 'Fada'], imunidades: ['Venenoso'] },
            Fada: { fraquezas: ['Venenoso', 'Aço'], resistencias: ['Lutador', 'Inseto', 'Sombrio'], imunidades: ['Dragão'] }
        };

        // Simulação do time atual (Você pode substituir pelos dados reais do seu gerador)
        const timeAtual = [
            { nome: 'Charizard', tipos: ['Fogo', 'Voador'] },
            { nome: 'Gyarados', tipos: ['Água', 'Voador'] },
            { nome: 'Garchomp', tipos: ['Dragão', 'Terra'] },
            { nome: 'Gholdengo', tipos: ['Aço', 'Fantasma'] },
            { nome: 'Iron Valiant', tipos: ['Fada', 'Lutador'] },
            { nome: 'Kingambit', tipos: ['Sombrio', 'Aço'] },
        ];

        // 1. Renderiza os Pokémon no Grid superior
        const gridTime = document.getElementById('grid-time');
        timeAtual.forEach(pkmn => {
            const badgesTipos = pkmn.tipos.map(t => `<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-700 text-slate-300 font-mono">${t}</span>`).join(' ');
            
            gridTime.innerHTML += `
                <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50 text-center hover:border-yellow-500/50 transition-all">
                    <div class="w-12 h-12 bg-slate-700 rounded-full mx-auto mb-2 flex items-center justify-center font-bold text-slate-400 text-xs truncate p-1">
                        ${pkmn.nome[0]}
                    </div>
                    <div class="font-medium text-sm truncate">${pkmn.nome}</div>
                    <div class="flex justify-center gap-1 mt-1">${badgesTipos}</div>
                </div>
            `;
        });

        // 2. Calcula as fraquezas e resistências acumuladas do time
        function calcularDefesas() {
            const balanco = {};
            Object.keys(tabelaTipos).forEach(tipo => balanco[tipo] = 0);

            timeAtual.forEach(pkmn => {
                pkmn.tipos.forEach(tipo => {
                    tabelaTipos[tipo].fraquezas.forEach(f => balanco[f] += 1);
                    tabelaTipos[tipo].resistencias.forEach(r => balanco[r] -= 1);
                    tabelaTipos[tipo].imunidades.forEach(i => balanco[i] -= 2);
                });
            });
            return balanco;
        }

        // 3. Renderiza o gráfico de barras dinâmico
        const defesas = calcularDefesas();
        const containerGrafico = document.getElementById('grafico-tipos');

        Object.entries(defesas).forEach(([tipo, valor]) => {
            let corBarra = "bg-slate-600";
            if (valor > 0) corBarra = "bg-red-500";
            if (valor < 0) corBarra = "bg-emerald-500";

            // Cálculo matemático para posicionar a barra para a esquerda (resistência) ou direita (fraqueza)
            const largura = Math.min(Math.abs(valor) * 15, 50);
            const margemEsquerda = valor >= 0 ? 50 : 50 - largura;

            const textoStatus = valor > 0 ? `+${valor} Fraco` : valor < 0 ? `${valor} Resiste` : 'Neutro';
            const corTexto = valor > 1 ? 'text-red-400 font-bold' : 'text-slate-400';

            containerGrafico.innerHTML += `
                <div class="flex items-center gap-4 text-sm">
                    <div class="w-20 font-medium text-slate-300 text-right">${tipo}</div>
                    <div class="flex-1 bg-slate-800 h-6 rounded-md relative overflow-hidden flex items-center">
                        <div class="absolute left-1/2 top-0 bottom-0 w-0.5 bg-slate-700 z-10"></div>
                        <div class="h-full transition-all duration-500 ${corBarra}" style="width: ${largura}%; margin-left: ${margemEsquerda}%;"></div>
                        <span class="absolute right-3 text-xs ${corTexto}">${textoStatus}</span>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
